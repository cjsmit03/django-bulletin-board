{% extends "base.html" %}

{% block content %}

<h2>My Products</h2>

<a href="{% url 'product_create' %}" class="btn btn-success mb-3">
    Add Product
</a>

<table class="table table-striped">

<tr>
    <th>Name</th>
    <th>Store</th>
    <th>Price</th>
    <th>Stock</th>
    <th></th>
</tr>

{% for product in products %}

<tr>

<td>{{ product.name }}</td>

<td>{{ product.store }}</td>

<td>${{ product.price }}</td>

<td>{{ product.stock }}</td>

<td>

<a
class="btn btn-primary btn-sm"
href="{% url 'product_update' product.id %}">

Edit

</a>

<a
class="btn btn-danger btn-sm"
href="{% url 'product_delete' product.id %}">

Delete

</a>

</td>

</tr>

{% empty %}

<tr>

<td colspan="5">

No products found.

</td>

</tr>

{% endfor %}

</table>

{% endblock %}
