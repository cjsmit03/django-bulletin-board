{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header">

                <h3>Login</h3>

            </div>

            <div class="card-body">

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Login
                    </button>

                </form>

                <hr>

                <p>

                    <a href="{% url 'password_reset' %}">

                        Forgot your password?

                    </a>

                </p>

                <p>

                    Don't have an account?

                    <a href="{% url 'register' %}">

                        Register

                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
